<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <script src="script.js" defer></script>
        <link rel="stylesheet" href="style.css">

        <title>Chess</title>
    </head>

    <body>
        <h1>Chess</h1>
        <button id="white-button" onclick="setPlayerColour('w')">White</button>
        <button id="random-button" onclick="setPlayerColour(Math.random() < 0.5 ? 'w' : 'b')">Random</button>
        <button id="black-button" onclick="setPlayerColour('b')">Black</button>
        <button id="start-button" onclick="start()" disabled>Start</button>
        <div id="board-container"></div>
    </body>
</html>
